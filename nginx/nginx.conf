events {
	worker_connections 1024;
}
http {
	server {
		listen 80;
		server_name localhost;
		root /usr/share/nginx/html;

		location / {
			# change this to 'my-app:9090' when/if one exists
			proxy_pass http://localhost:9090;
		}
	}

	# setting up a secondary server here to
	server {
		listen 9090;
		server_name localhost; #in future, change this to point at the right place
		root /usr/share/nginx/html;

		location / {
		}
	}
}

