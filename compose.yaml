name: about-me
services:
    nginx:
        stdin_open: true
        tty: true
        ports:
            - "127.0.0.1:8080:80"
        container_name: nginx
        volumes:
            - /home/merlin/Projects/about-me/site-content:/usr/share/nginx/html
            - /home/merlin/Projects/about-me/common:/usr/share/nginx/html/common
            - /home/merlin/Projects/about-me/nginx/conf.d:/etc/nginx/conf.d
            - /home/merlin/Projects/about-me/nginx/nginx.conf:/etc/nginx/nginx.conf
        image: nginx
        networks:
        - app_net
        depends_on: # Ensures that services start before nginx
        - fileshare
    fileshare:
        stdin_open: true
        # Tells it what directory to be in basically.
        build: ./fileshare 
        tty: true
        # Doesn't need a ports block because it's not exposed externally
        container_name: fileshare
        # Maps the fileshare content folder to the internal /usr/share/content
        # directory of the container
        # **Had to run with docker compose up --build the first time because
        # I had made Dockerfile changes that weren't picked up!!!
        volumes:
            - /home/merlin/Projects/about-me/fileshare/content:/usr/share/content
        networks:
        - app_net
networks:
    app_net:
        driver: bridge
